[package]
name = "loan-dicer"
version = "1.0.0"
authors = ["Jordon Tolotti <jtolotti@figure.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[package.metadata.scripts]
optimize = "./scripts/optimize.sh"

[dependencies]
cosmwasm-schema = "2.2.0"
cosmwasm-std = { version = "2.2.2", features = [
  "cosmwasm_2_1",
  "stargate",
  "std"
] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
schemars = "0.8.15"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.49" }
provwasm-std = { version = "2.0.0" }
uuid = { version = "1.7.0", features = ["v1"] }
itertools = "0.12"

[dev-dependencies]
provwasm-common = "0.2.0"
provwasm-mocks = "=2.5.0"
